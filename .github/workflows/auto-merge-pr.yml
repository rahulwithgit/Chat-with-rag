name: Auto Create Merge PR

on:
  push:
    branches-ignore:
      - dev

jobs:
  check-and-create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message
        id: check_message
        run: |
          # Get the latest commit message
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "commit_message=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          
          # Check if commit message ends with "- merge"
          if [[ "$COMMIT_MESSAGE" == *"- merge" ]]; then
            echo "should_create_pr=true" >> $GITHUB_OUTPUT
            echo "✅ Commit message ends with '- merge', will create PR"
          else
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            echo "❌ Commit message does not end with '- merge', skipping PR creation"
          fi

      - name: Create Pull Request
        if: steps.check_message.outputs.should_create_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists for this branch → dev
          EXISTING=$(gh pr list --base dev --head "${{ github.ref_name }}" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists, skipping."
            exit 0
          fi

          # Create labels if they don't exist yet (safe to re-run)
          gh label create "automated" --color "0e8a16" --description "Auto-generated PR" 2>/dev/null || true
          gh label create "merge-request" --color "1d76db" --description "Branch merge PR" 2>/dev/null || true

          gh pr create \
            --base dev \
            --head "${{ github.ref_name }}" \
            --title "Merge: ${{ github.ref_name }} → dev" \
            --body "Automatic merge pull request from branch \`${{ github.ref_name }}\`.

          **Latest commit message:**
          \`\`\`
          ${{ steps.check_message.outputs.commit_message }}
          \`\`\`

          Please review and merge if everything looks good." \
            --label "automated" --label "merge-request"
